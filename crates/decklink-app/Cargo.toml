[package]
name = "decklink-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckLink — Steam Deck Wi-Fi gamepad / keyboard+mouse"
default-run = "decklink-bt"

[[bin]]
name = "decklink-bt"
path = "src/main.rs"

[dependencies]
decklink-hid.workspace = true
decklink-input.workspace = true
decklink-net.workspace = true
decklink-profiles.workspace = true
decklink-ui.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
clap = { version = "4", features = ["derive"] }
slint = { version = "1.9", default-features = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
