name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release -p decklink-app

      - name: Package tarball
        run: |
          STAGE=decklink-bt-linux-x86_64
          mkdir -p "$STAGE"
          cp target/release/decklink-bt "$STAGE/"
          cp README.md LICENSE LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp -r scripts packaging "$STAGE/"
          tar -czf decklink-bt-linux-x86_64.tar.gz "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: decklink-bt-linux-x86_64
          path: decklink-bt-linux-x86_64.tar.gz

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: decklink-bt-linux-x86_64.tar.gz
          generate_release_notes: true
          draft: false
          body: |
            ## DeckLink BT

            Steam Deck as a driverless BLE HOGP gamepad.

            ### Install (Steam Deck Desktop Mode)
            1. Download `decklink-bt-linux-x86_64.tar.gz` below
            2. Extract and run `./scripts/install-deck.sh ./decklink-bt-linux-x86_64.tar.gz`
            3. Launch **DeckLink BT** from Gaming Mode → Start Advertising → pair from host

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev libgl1-mesa-dev libfontconfig1-dev libfreetype6-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test -p decklink-hid -p decklink-profiles
