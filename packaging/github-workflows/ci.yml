name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libdbus-1-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libx11-dev libxcursor-dev \
            libxi-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace
      - name: Test portable crates
        run: cargo test -p decklink-hid -p decklink-profiles
