# Flatpak manifest for DeckLink BT (built by CI / flatpak-builder)
# App ID: io.github.bastianjosekottekudy_cmyk.DeckLinkBT

app-id: io.github.bastianjosekottekudy_cmyk.DeckLinkBT
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: decklink-bt
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=system-bus
  - --socket=session-bus
  - --device=all
  - --device=dri
  - --talk-name=org.bluez
  - --talk-name=org.freedesktop.DBus
  - --filesystem=xdg-config/decklink-bt:create
  - --env=RUST_LOG=decklink_bt=info
modules:
  - name: decklink-bt
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/decklink-bt/cargo
    build-commands:
      - cargo --offline build --release -p decklink-app || cargo build --release -p decklink-app
      - install -Dm755 target/release/decklink-bt /app/bin/decklink-bt
    sources:
      - type: dir
        path: ../..
